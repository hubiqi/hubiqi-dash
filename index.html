<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>项目仪表盘 · hubiqi</title>
<meta name="theme-color" content="#06070c">
<meta name="description" content="hubiqi 的全部静态站点与看板入口">
<style>
:root{
  --bg:#06070c; --fg:#e9edf6; --muted:#8b93a7; --dim:#5b6478;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --card:rgba(255,255,255,.034); --card2:rgba(255,255,255,.06);
  --cf:#f6821f; --gh:#a371f7;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--fg); min-height:100dvh;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding:0 18px env(safe-area-inset-bottom);
}
/* ── 极光背景 ───────────────────────────── */
.aurora{position:fixed;inset:-30% -20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.5}
.aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:52vw;height:52vw;left:-6vw;top:2vh;background:radial-gradient(circle,#3b82f6,transparent 68%);animation:drift1 22s ease-in-out infinite}
.aurora i:nth-child(2){width:46vw;height:46vw;right:-8vw;top:-4vh;background:radial-gradient(circle,#a855f7,transparent 68%);animation:drift2 27s ease-in-out infinite}
.aurora i:nth-child(3){width:44vw;height:44vw;left:32vw;top:52vh;background:radial-gradient(circle,#ec4899,transparent 70%);animation:drift3 31s ease-in-out infinite}
@keyframes drift1{50%{transform:translate(14vw,10vh) scale(1.18)}}
@keyframes drift2{50%{transform:translate(-12vw,14vh) scale(1.12)}}
@keyframes drift3{50%{transform:translate(-16vw,-12vh) scale(1.2)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 20%,transparent 76%);
          mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 20%,transparent 76%)}
main,header,footer{position:relative;z-index:1}
.wrap{max-width:1060px;margin:0 auto}

/* ── 头部 ───────────────────────────────── */
header{padding:56px 0 26px;text-align:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.19em;
  text-transform:uppercase;color:#a9b3c9;font-weight:600;
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.03);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.dot-live{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
h1{
  font-size:clamp(30px,7.4vw,46px);line-height:1.12;font-weight:800;letter-spacing:-.028em;
  margin:16px 0 10px;
  background:linear-gradient(104deg,#e9edf6 8%,#8ab4ff 42%,#c4a2ff 66%,#f8a3c9 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--muted);font-size:13.5px}
.sub b{color:#cbd5e8;font-weight:600}
.sub .sep{margin:0 8px;color:var(--dim)}

/* ── 统计条 ─────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px 0 22px}
.stat{
  border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:var(--card);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.25s
}
.stat:hover{border-color:var(--line2);background:var(--card2);transform:translateY(-2px)}
.stat .k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.stat.cf .v{color:var(--cf)} .stat.gh .v{color:var(--gh)}

/* ── 工具栏 ─────────────────────────────── */
.bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  padding:7px 14px;border-radius:9px;cursor:pointer;transition:.2s;white-space:nowrap
}
.tab:hover{color:var(--fg)}
.tab.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.09) inset}
.tab .n{opacity:.55;font-size:11.5px;margin-left:4px}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.42;pointer-events:none}
#q{
  width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13.5px;
  padding:10px 13px 10px 38px;border-radius:12px;outline:0;transition:.2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
#q::placeholder{color:var(--dim)}
#q:focus{border-color:rgba(140,170,255,.55);background:var(--card2);box-shadow:0 0 0 4px rgba(110,150,255,.09)}

/* ── 卡片网格 ───────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.card{
  position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:var(--r);padding:17px 17px 15px;background:var(--card);
  overflow:hidden;isolation:isolate;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .3s cubic-bezier(.22,.61,.36,1),border-color .3s,background .3s,box-shadow .3s;
  animation:pop .5s cubic-bezier(.22,.61,.36,1) forwards
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}}
/* 悬停时顶部渐变描边 */
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:2;opacity:0;transition:opacity .3s;
  background:linear-gradient(140deg,var(--c),transparent 46%,transparent 54%,var(--c));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  pointer-events:none
}
.card::after{
  content:"";position:absolute;width:230px;height:230px;right:-96px;top:-104px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,var(--c),transparent 70%);opacity:.14;transition:opacity .35s,transform .35s;
}
.card:hover{transform:translateY(-5px);border-color:transparent;background:var(--card2);box-shadow:0 18px 42px -20px var(--c)}
.card:hover::before{opacity:1}
.card:hover::after{opacity:.26;transform:scale(1.14)}
.card:focus-visible{outline:2px solid #8ab4ff;outline-offset:3px}
.card.cf{--c:#f6821f} .card.gh{--c:#a371f7}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plat{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.plat i{width:7px;height:7px;border-radius:2px;background:var(--c);display:block}
.kind{font-size:10.5px;color:#9aa4bb;border:1px solid var(--line);border-radius:999px;padding:2.5px 9px;background:rgba(255,255,255,.03)}
.body{display:flex;gap:12px;align-items:flex-start}
.ico{
  flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  font-size:16px;font-weight:800;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 52%,#1c2030));
  box-shadow:0 7px 18px -8px var(--c)
}
.name{font-size:16px;font-weight:700;letter-spacing:-.012em;word-break:break-all;line-height:1.35}
.desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:11px;border-top:1px solid rgba(255,255,255,.06)}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#9fb0cf;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd{font-size:11px;color:var(--dim);white-space:nowrap;flex:0 0 auto}
.arrow{position:absolute;right:15px;bottom:44px;font-size:15px;color:var(--c);opacity:0;transform:translate(-5px,5px);transition:.28s}
.card:hover .arrow{opacity:1;transform:none}

.empty{text-align:center;color:var(--dim);padding:56px 0;font-size:14px;display:none}
.empty.on{display:block}
/* ── 多通道切换 ─────────────────────────── */
.chans{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
  margin:0 0 14px;font-size:12.5px;color:var(--dim)}
.chans .lb{letter-spacing:.1em;font-size:10.5px;text-transform:uppercase;font-weight:600}
.chans a{border:1px solid var(--line);border-radius:999px;padding:5px 13px;text-decoration:none;
  color:var(--muted);transition:.2s;font-weight:600}
.chans a:hover{border-color:var(--line2);color:var(--fg)}
.chans a.cur{border-color:rgba(140,170,255,.6);color:#fff;background:rgba(110,150,255,.14)}
.chans .tip{opacity:.75}

footer{text-align:center;color:var(--dim);font-size:11.5px;line-height:1.9;padding:44px 0 40px}
footer a{color:#93a2c0;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.16)}
footer a:hover{color:#cfd9ec}
kbd{font:inherit;font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:rgba(255,255,255,.05);color:#9aa4bb}

@media (max-width:620px){
  header{padding:38px 0 20px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:22px}
  .grid{grid-template-columns:1fr}
  .bar{gap:8px}
  .tabs{width:100%;justify-content:space-between}
  .tab{flex:1;text-align:center;padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grid-bg" aria-hidden="true"></div>

<header>
  <div class="wrap">
    <span class="eyebrow"><span class="dot-live"></span>hubiqi · project hub</span>
    <h1>项目仪表盘</h1>
    <p class="sub">共 <b id="subN">0</b> 个在线站点<span class="sep">·</span>数据快照 <b>2026-10-13 21:16 (北京)</b><span class="sep">·</span>本机时间 <b id="clock">--:--:--</b></p>
  </div>
</header>

<main class="wrap">
  <section class="stats" id="stats"></section>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索项目…  ( 按 / 聚焦 )" autocomplete="off" spellcheck="false">
    </label>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">没有匹配的项目</p>
</main>

<footer class="wrap">
  <div class="chans">
    <span class="lb">访问通道</span>
    <a id="ch-cf" href="https://hubiqi-dash.pages.dev/">Cloudflare</a>
    <a id="ch-gh" href="https://hubiqi.github.io/hubiqi-dash/">GitHub</a>
    <span class="tip">哪条通走哪条</span>
  </div>
  数据来自 Cloudflare Pages API 与 GitHub API，构建时烘入页面<br>Cloudflare 侧入口 <a href="https://hubiqi.pages.dev/">hubiqi.pages.dev</a> · GitHub 侧入口 <a href="https://hubiqi.github.io/">hubiqi.github.io</a>
</footer>

<script>
var DATA = {"projects": [{"p": "cf", "name": "hubiqi-dashboard", "host": "hubiqi-dashboard.pages.dev", "url": "https://hubiqi-dashboard.pages.dev/", "kind": "看板", "desc": "骑手超时绩效看板 · 剔除口径 / 分层计费 / 超时明细", "upd": "10-12 18:38", "st": 200}, {"p": "cf", "name": "hubiqi-hole", "host": "hubiqi-hole.pages.dev", "url": "https://hubiqi-hole.pages.dev/", "kind": "站点", "desc": "黑名单 / 洞口分析", "upd": "10-11 09:56", "st": 200}, {"p": "cf", "name": "hubiqi-dash", "host": "hubiqi-dash.pages.dev", "url": "https://hubiqi-dash.pages.dev/", "kind": "看板", "desc": "本项目仪表盘 — Cloudflare + GitHub 全部站点总入口", "upd": "10-11 09:39", "st": 200}, {"p": "cf", "name": "fengshen-dashboard", "host": "fengshen-dashboard.pages.dev", "url": "https://fengshen-dashboard.pages.dev/", "kind": "看板", "desc": "风神实时运营罗盘 · 考核指标 / 商圈指标 / T8", "upd": "10-10 09:44", "st": 200}, {"p": "cf", "name": "hubiqi-table-merge", "host": "hubiqi-table-merge.pages.dev", "url": "https://hubiqi-table-merge.pages.dev/", "kind": "工具", "desc": "Excel 表格合并（保留全部表头，本地解析不上传）", "upd": "10-10 06:26", "st": 200}, {"p": "cf", "name": "hubiqi-idphoto", "host": "hubiqi-idphoto.pages.dev", "url": "https://hubiqi-idphoto.pages.dev/", "kind": "站点", "desc": "AI 证件照", "upd": "10-09 17:55", "st": 200}, {"p": "cf", "name": "hubiqi-weekly", "host": "hubiqi-weekly.pages.dev", "url": "https://hubiqi-weekly.pages.dev/", "kind": "站点", "desc": "周报", "upd": "09-29 09:15", "st": 200}, {"p": "cf", "name": "hubiqi-img", "host": "hubiqi-img.pages.dev", "url": "https://hubiqi-img.pages.dev/", "kind": "站点", "desc": "图片托管", "upd": "09-12 18:07", "st": 200}, {"p": "cf", "name": "hubiqi", "host": "hubiqi.pages.dev", "url": "https://hubiqi.pages.dev/", "kind": "导航页", "desc": "Cloudflare 侧项目导航，自动列出全部 Pages 项目", "upd": "09-12 17:30", "st": 200}, {"p": "gh", "name": "hubiqi.github.io", "host": "hubiqi.github.io", "url": "https://hubiqi.github.io/", "kind": "导航页", "desc": "GitHub 侧项目导航，自动列出全部子路径项目", "upd": "10-13 01:42", "st": 200}, {"p": "gh", "name": "rider-dashboard", "host": "hubiqi.github.io/rider-dashboard", "url": "https://hubiqi.github.io/rider-dashboard/", "kind": "看板", "desc": "骑手超时绩效看板", "upd": "10-12 18:37", "st": 200}, {"p": "gh", "name": "fengshen-dashboard", "host": "hubiqi.github.io/fengshen-dashboard", "url": "https://hubiqi.github.io/fengshen-dashboard/", "kind": "看板", "desc": "风神实时运营罗盘（GitHub 镜像）", "upd": "10-10 09:45", "st": 200}, {"p": "gh", "name": "table-merge", "host": "hubiqi.github.io/table-merge", "url": "https://hubiqi.github.io/table-merge/", "kind": "工具", "desc": "Excel 表格合并", "upd": "10-10 06:28", "st": 200}, {"p": "gh", "name": "idphoto-web", "host": "hubiqi.github.io/idphoto-web", "url": "https://hubiqi.github.io/idphoto-web/", "kind": "站点", "desc": "AI 证件照 Web", "upd": "10-09 18:04", "st": 200}, {"p": "gh", "name": "xinzhuan-song-salary", "host": "hubiqi.github.io/xinzhuan-song-salary", "url": "https://hubiqi.github.io/xinzhuan-song-salary/", "kind": "看板", "desc": "薪转松 · 薪资看板", "upd": "09-29 10:38", "st": 200}, {"p": "gh", "name": "demo", "host": "hubiqi.github.io/demo", "url": "https://hubiqi.github.io/demo/", "kind": "示例", "desc": "示例项目（用于验证导航自动更新）", "upd": "09-12 06:43", "st": 200}]};
var MAP = {cf:'Cloudflare', gh:'GitHub'};

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function card(p, i){
  return '<a class="card ' + p.p + '" href="' + esc(p.url) + '" target="_blank" rel="noopener"'
       + ' style="animation-delay:' + (i * 55) + 'ms" data-k="' + esc((p.name + ' ' + p.desc + ' ' + p.url + ' ' + p.kind).toLowerCase()) + '" data-p="' + p.p + '">'
       + '<div class="top"><span class="plat"><i></i>' + MAP[p.p] + '</span>'
       + '<span class="kind">' + esc(p.kind) + '</span></div>'
       + '<div class="body"><div class="ico">' + esc(p.name.charAt(0).toUpperCase()) + '</div>'
       + '<div><div class="name">' + esc(p.name) + '</div>'
       + '<div class="desc">' + esc(p.desc || '—') + '</div></div></div>'
       + '<div class="foot"><span class="url">' + esc(p.host) + '</span>'
       + '<span class="upd">' + esc(p.upd) + '</span></div>'
       + '<span class="arrow" aria-hidden="true">↗</span></a>';
}

var stats = [
  {k:'项目总数', v: DATA.projects.length, c:''},
  {k:'Cloudflare', v: DATA.projects.filter(function(p){return p.p==='cf'}).length, c:'cf'},
  {k:'GitHub', v: DATA.projects.filter(function(p){return p.p==='gh'}).length, c:'gh'},
  {k:'平台', v: 2, c:''}
];
document.getElementById('stats').innerHTML = stats.map(function(s){
  return '<div class="stat ' + s.c + '"><div class="k">' + s.k + '</div><div class="v" data-t="' + s.v + '">0</div></div>';
}).join('');

var tabs = [{id:'all', label:'全部'}].concat(Object.keys(MAP).map(function(k){ return {id:k, label:MAP[k]}; }));
document.getElementById('tabs').innerHTML = tabs.map(function(t){
  var n = t.id === 'all' ? DATA.projects.length : DATA.projects.filter(function(p){return p.p===t.id}).length;
  return '<button class="tab' + (t.id==='all'?' on':'') + '" data-t="' + t.id + '">' + t.label + '<span class="n">' + n + '</span></button>';
}).join('');

document.getElementById('grid').innerHTML = DATA.projects.map(card).join('');
document.getElementById('subN').textContent = DATA.projects.length;

/* 数字滚动：先把正确值写进 DOM，动画只是锦上添花。
   若 rAF 被节流/不触发（后台标签页、省电模式），显示仍是正确值而不是 0。 */
var els = [].slice.call(document.querySelectorAll('.v[data-t]'));
els.forEach(function(el){
  var to = +el.dataset.t;
  el.textContent = to;
  if (to === 0) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var t0 = performance.now(), dur = 620, done = false;
  var fin = function(){ if (!done) { done = true; el.textContent = to; } };
  requestAnimationFrame(function step(t){
    if (done) return;
    var k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step); else fin();
  });
  setTimeout(fin, dur + 500);
});

/* 过滤 */
var cur = 'all';
function apply(){
  var w = document.getElementById('q').value.trim().toLowerCase(), shown = 0;
  [].slice.call(document.querySelectorAll('.card')).forEach(function(c){
    var ok = (cur === 'all' || c.dataset.p === cur) && (!w || c.dataset.k.indexOf(w) > -1);
    c.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  document.getElementById('empty').className = shown ? 'empty' : 'empty on';
}
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if (!b) return;
  cur = b.dataset.t;
  [].slice.call(document.querySelectorAll('.tab')).forEach(function(x){ x.className = 'tab' + (x === b ? ' on' : ''); });
  apply();
});
document.getElementById('q').addEventListener('input', apply);
document.addEventListener('keydown', function(e){
  if (e.key === '/' && document.activeElement !== document.getElementById('q')) {
    e.preventDefault(); document.getElementById('q').focus();
  }
});

/* 时钟 */
function tick(){
  var d = new Date();
  var p = function(n){ return String(n).padStart(2, '0'); };
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
tick(); setInterval(tick, 1000);

/* 通道高亮：当前域名属于哪个通道 */
(function(){
  var h = location.hostname;
  var cur = h.indexOf('github.io') > -1 ? 'ch-gh' : 'ch-cf';
  var el = document.getElementById(cur);
  if (el) { el.className = 'cur'; el.setAttribute('aria-current','page'); }
})();

/* 兜底：入场动画若被节流/禁用（后台标签、省电模式、部分 WebView），
   卡片会停在 opacity:0 看起来「整页空白」。1.4s 后强制清除动画。 */
setTimeout(function(){
  var s = document.createElement('style');
  s.textContent = '.card{animation:none!important;opacity:1!important;transform:none!important}';
  document.head.appendChild(s);
}, 1400);
</script>
</body>
</html>
